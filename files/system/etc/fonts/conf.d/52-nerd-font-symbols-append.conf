<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fedora's own nerd-fonts package (10-nerd-font-symbols.conf) wires the
  Symbols Nerd Font in as a fallback via <alias><prefer>, but only for a
  fixed list of specific font family names it knows about (Fira Code, IBM
  3270, etc.) and only when a Pango/GTK app resolves that exact alias.

  Chromium/Electron apps (VS Code, Positron, ...) use their own Skia-based
  font matcher, which builds its candidate list from whatever family string
  the app itself requested rather than going through fontconfig's <alias>
  substitution the same way — so an app asking for a family that isn't on
  Fedora's list (or one not phrased exactly the way the alias expects) never
  gets the symbol glyphs, and shows tofu boxes instead of icons.

  <match target="pattern"> + <edit mode="append"> works differently: it
  appends Symbols Nerd Font Mono directly onto fontconfig's candidate list
  for *any* pattern requesting a monospace-ish family, before the requesting
  app's own matcher ever runs — so it's picked up regardless of which
  specific family name the app asked for or how its font matcher is
  implemented. Harmless to apps that never need those glyphs; it's a
  low-priority (binding="weak") fallback, never a replacement.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family" compare="contains">
      <string>mono</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="contains">
      <string>code</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Mirrors the rule from the retired Fedora bbox-firago-fonts package.
     The fonts themselves live in /usr/share/fonts/firago (FiraGO 1.001, OFL). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>FiraGO</family>
    </prefer>
  </alias>
  <alias>
    <family>FiraGO</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
</fontconfig>

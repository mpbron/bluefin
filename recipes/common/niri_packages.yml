type: dnf
repos:
  cleanup: true
  copr:
    - ublue-os/packages
    - celestelove/app2unit
    - tofik/nwg-shell
install:
  allow-erasing: true
  exclude:
    - alacritty
    - waybar
    - mako
    - swaybg
    - swaylock
    - swayidle
  packages:
    - app2unit
    - btop
    - bat
    - bluez-tools
    - eza
    - fd-find
    - fuse-overlayfs
    - fprintd
    - fprintd-pam
    - gcr
    - gnome-keyring
    - gvfs
    - gvfs-mtp
    - gvfs-fuse
    - gvfs-archive
    - gvfs-smb
    - kitty
    - nautilus
    - noctalia
    - blueman-nautilus
    - nautilus-python
    - NetworkManager-openvpn
    - nm-connection-editor
    - niri
    - nwg-look
    - polkit
    - qt5-qtwayland
    - qt6ct
    - qt6-qtwayland
    - tldr
    - tuned-ppd
    - wl-mirror
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xwayland-satellite
    - zoxide
    - xdg-user-dirs

remove:
  auto-remove: true
  packages:
    - weston
    - firefox
    - firefox-langpacks
    - waybar